name: Build and Push Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install ko
        run: go install github.com/google/ko@v0.16.2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export KO_DOCKER_REPO=docker.io/brycehuang/knative
          ko resolve --tags=${TAG} -f ./config/core/
          ko resolve --tags=${TAG} -f ./config/hpa-autoscaling/
          ko resolve --tags=${TAG} -f ./config/post-install/