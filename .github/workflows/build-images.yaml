name: Build and Push Images

on:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Extract version from branch name: feature/v1.22.3 -> v1.22.3
            BRANCH_NAME="${{ github.ref_name }}"
            VERSION="${BRANCH_NAME#feature/}"
            TAG="${VERSION}_${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG}"

      - name: Checkout net-contour
        uses: actions/checkout@v4
        with:
          repository: wbkunlun/net-contour
          path: net-contour

      - name: Build and push serving images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: docker.io/brycehuang/knative
        run: |
          for component in activator autoscaler controller queue webhook; do
            echo "Building ${component}..."
            TARGET_FLAG=""
            if [ "${component}" = "queue" ]; then
              TARGET_FLAG="--target=wolfi"
            fi
            docker buildx build \
              --platform linux/amd64 \
              --build-arg component=${component} \
              ${TARGET_FLAG} \
              --tag ${REGISTRY}:${component}-${TAG} \
              --push \
              .
            echo "Pushed ${component}:${TAG}"
          done

      - name: Build and push net-contour image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: docker.io/brycehuang/knative
        working-directory: net-contour
        run: |
          echo "Building net-contour-controller..."
          docker buildx build \
            --platform linux/amd64 \
            --build-arg component=controller \
            --tag ${REGISTRY}:net-contour-controller-${TAG} \
            --push \
            .
          echo "Pushed net-contour-controller:${TAG}"