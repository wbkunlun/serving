name: Build and Push Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Go
      uses: knative/actions/setup-go@main

    - name: Install ko
      run: |
        # Install ko v0.8.0 without SBOM issues
        go install github.com/google/ko@v0.8.0

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Images
      env:
        TAG: ${{ github.ref_name }}
      run: |
        export KO_DOCKER_REPO=docker.io/brycehuang/knative
        export KO_FLAGS=--platform=linux/amd64
        # Build core images
        ko resolve --tags ${TAG} -RBf ./config/core/
        # Build HPA autoscaling images
        ko resolve --tags ${TAG} -RBf ./config/hpa-autoscaling/
        # Build post-install images
        ko resolve --tags ${TAG} -RBf ./config/post-install/

    - name: List pushed images
      run: |
        echo "Images pushed to docker.io/brycehuang/knative:"
        crane ls docker.io/brycehuang/knative 2>/dev/null | head -20 || echo "Image listing not available"